name: nexo_360
publish_to: none
description: Plataforma escolar completa NEXO 360 para Android, Windows y Web.
version: 2.0.0+20

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  go_router: ^17.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
  shared_preferences: ^2.5.0
  intl: ^0.20.0
  url_launcher: ^6.3.0
  http: ^1.4.0
  uuid: ^4.5.0
  collection: ^1.19.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/nexo_360_icon.png
    - assets/images/nexo_360_logo.png
    - assets/images/juventud_2026.png
    - assets/images/croquis_evento.png
