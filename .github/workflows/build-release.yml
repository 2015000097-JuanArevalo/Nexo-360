name: Build APK and Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android platform files
        run: flutter create --platforms=android --org com.example --project-name nexo_360 .
      - name: Add Android permissions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions='''<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>'''
          if 'android.permission.CAMERA' not in s:
              s=s.replace(marker,permissions)
          p.write_text(s)
          gradle=Path('android/app/build.gradle.kts')
          g=gradle.read_text()
          g=g.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
          gradle.write_text(g)
          PY
      - run: flutter pub get
      - run: dart run flutter_launcher_icons -f flutter_launcher_icons_android.yaml
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Build release APK
        run: flutter build apk --release --dart-define=STORAGE_ENABLED=false
      - name: Prepare APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ../NEXO-360-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: NEXO-360-Android.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Windows platform files
        run: flutter create --platforms=windows --org com.example --project-name nexo_360 .
      - run: flutter pub get
      - run: dart run flutter_launcher_icons -f flutter_launcher_icons_windows.yaml
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Build Windows release
        run: flutter build windows --release --dart-define=STORAGE_ENABLED=false
      - name: Package Windows folder
        shell: powershell
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ../NEXO-360-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: NEXO-360-Windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/NEXO-360-Android.apk release-assets/NEXO-360-Windows.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "NEXO 360 ${GITHUB_REF_NAME}" \
            --generate-notes
